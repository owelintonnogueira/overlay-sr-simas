name: Gerar instalador (Windows)

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build (PyInstaller + Inno Setup)
        shell: pwsh
        run: ./build_windows.ps1 -CI
      - uses: actions/upload-artifact@v4
        with:
          name: CortesLive-Setup
          path: installer_output/CortesLive-Setup.exe
      - name: Publicar na aba Releases (só em tags v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/CortesLive-Setup.exe
